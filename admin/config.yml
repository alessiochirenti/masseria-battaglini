# Pannello di gestione del sito (Sveltia CMS).
# Ogni salvataggio scrive nel repository; il sito si rigenera da solo in un paio di minuti.
# Le voci qui sotto sono le uniche cose che il pannello può modificare: struttura,
# animazioni e layout restano nel codice.

backend:
  name: github
  repo: alessiochirenti/masseria-battaglini
  branch: main
  commit_messages:
    create: "Pannello: nuovo {{collection}} {{slug}}"
    update: "Pannello: aggiornato {{collection}} {{slug}}"
    delete: "Pannello: eliminato {{collection}} {{slug}}"
    uploadMedia: "Pannello: caricata foto {{path}}"
    deleteMedia: "Pannello: eliminata foto {{path}}"

site_url: "https://alessiochirenti.github.io/masseria-battaglini/"
display_url: "https://alessiochirenti.github.io/masseria-battaglini/"
logo_url: "https://alessiochirenti.github.io/masseria-battaglini/uploads/logo.png"

media_folder: "/public/uploads"
public_folder: "/uploads"

# Le foto caricate dal telefono vengono convertite in webp e ridotte a 2048 px prima del salvataggio.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

collections:
  - name: contenuti
    label: "Il sito"
    description: "Testi, foto e contatti del sito. Scegliete una pagina, modificate, poi Salva: in un paio di minuti è online."
    editor:
      preview: false
    files:
      - name: site
        label: "Dati generali e contatti"
        file: content/site.json
        fields:
          - { name: nome, label: "Nome della struttura", widget: string }
          - { name: logo, label: "Logo (su sfondo scuro)", widget: image, required: false }
          - { name: descrizione, label: "Descrizione per Google e social", widget: text, hint: "Una o due frasi. Compare nei risultati di ricerca e quando il link viene condiviso." }
          - { name: indicizza, label: "Sito visibile su Google", widget: boolean, default: false, hint: "Lasciate spento finché il sito non è ufficiale." }
          - { name: url, label: "Indirizzo del sito", widget: string, hint: "Lo imposta chi sviluppa il sito." }
          - name: menu
            label: "Voci del menu"
            widget: object
            fields:
              - { name: racconto, label: "Voce del racconto", widget: string }
              - { name: dimore, label: "Voce delle dimore", widget: string }
              - { name: esperienze, label: "Voce delle esperienze", widget: string }
              - { name: cta, label: "Bottone in alto a destra", widget: string }
          - name: contatti
            label: "Contatti"
            widget: object
            fields:
              - { name: ragione_sociale, label: "Ragione sociale", widget: string }
              - { name: indirizzo, label: "Indirizzo", widget: string }
              - { name: email, label: "Email", widget: string }
              - { name: telefono, label: "Telefono (come lo si legge)", widget: string }
              - { name: whatsapp, label: "WhatsApp (solo cifre, con 39 davanti)", widget: string, hint: "Es. 393925833330" }
              - { name: instagram, label: "Pagina Instagram", widget: string, required: false }
              - { name: facebook, label: "Pagina Facebook", widget: string, required: false }
          - name: form
            label: "Modulo di richiesta"
            widget: object
            fields:
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - { name: bottone, label: "Testo del bottone", widget: string }
              - { name: nota, label: "Nota sotto il bottone", widget: string }
              - { name: interessi, label: "Opzioni del campo Vi interessa", widget: list, field: { name: voce, label: "Voce", widget: string } }
              - { name: grazie, label: "Messaggio dopo l'invio", widget: string }
              - { name: grazie_riga2, label: "Messaggio dopo l'invio, seconda riga", widget: string }

      - name: home
        label: "Home"
        file: content/home.json
        fields:
          - name: hero
            label: "Apertura (la notte)"
            widget: object
            fields:
              - { name: kicker, label: "Riga piccola sopra il nome", widget: string }
              - { name: riga1, label: "Nome, prima riga", widget: string }
              - { name: riga2, label: "Nome, riga grande in corsivo", widget: string }
              - { name: tagline, label: "Frase sotto il nome", widget: string }
              - { name: hint, label: "Invito a scorrere", widget: string }
          - name: alba
            label: "Frase dell'alba"
            widget: object
            fields:
              - { name: riga1, label: "Prima riga", widget: string }
              - { name: riga2, label: "Seconda riga, in corsivo", widget: string }
          - name: arrivo
            label: "Foto dell'arrivo"
            widget: object
            fields:
              - { name: foto, label: "Foto a tutto schermo", widget: image }
              - { name: alt, label: "Descrizione della foto (per chi non vede)", widget: string }
              - { name: parola, label: "Parola sulla foto", widget: string }
          - name: storia
            label: "Pannello chi siamo"
            widget: object
            fields:
              - { name: kicker, label: "Riga piccola sopra il titolo", widget: string, required: false }
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - { name: testo, label: "Testo", widget: text, hint: "Una riga vuota separa i paragrafi. Le *parole tra asterischi* vengono in corsivo." }
              - { name: foto, label: "Foto", widget: image, required: false }
              - { name: alt, label: "Descrizione della foto", widget: string, required: false }
              - { name: didascalia, label: "Didascalia", widget: string, required: false }
              - { name: link, label: "Testo del link al racconto", widget: string, required: false }
          - name: terra
            label: "Pannello la campagna"
            widget: object
            fields:
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - name: numeri
                label: "I quattro numeri"
                widget: list
                max: 4
                fields:
                  - { name: valore, label: "Numero", widget: string }
                  - { name: etichetta, label: "Etichetta", widget: string }
              - { name: testo, label: "Testo", widget: text }
              - { name: foto, label: "Foto", widget: image, required: false }
              - { name: alt, label: "Descrizione della foto", widget: string, required: false }
              - { name: didascalia, label: "Didascalia", widget: string, required: false }
              - { name: link, label: "Testo del link alle dimore", widget: string, required: false }
          - name: mezzogiorno
            label: "Frase di mezzogiorno"
            widget: object
            fields:
              - { name: frase, label: "Frase grande che attraversa lo schermo", widget: string, hint: "Tre o quattro parole al massimo." }
              - { name: sottotitolo, label: "Riga piccola", widget: string }
          - name: sera
            label: "Le schede della sera"
            widget: object
            fields:
              - { name: kicker, label: "Riga piccola", widget: string, required: false }
              - { name: titolo, label: "Titolo", widget: string }
              - name: card
                label: "Schede"
                widget: list
                max: 5
                fields:
                  - { name: titolo, label: "Titolo", widget: string }
                  - { name: testo, label: "Testo", widget: text }
                  - { name: foto, label: "Foto di sfondo", widget: image }
                  - name: posizione_foto
                    label: "Inquadratura della foto"
                    widget: select
                    required: false
                    options:
                      - { label: "Centrata", value: "center center" }
                      - { label: "Privilegia la parte sinistra", value: "left center" }
                      - { label: "Privilegia la parte destra", value: "right center" }
                  - name: link
                    label: "Pagina di destinazione"
                    widget: select
                    options:
                      - { label: "Le dimore", value: "camere.html" }
                      - { label: "Esperienze", value: "esperienze.html" }
                      - { label: "Esperienze, benessere", value: "esperienze.html#benessere" }
                      - { label: "Esperienze, la tavola", value: "esperienze.html#tavola" }
                      - { label: "Esperienze, colazione", value: "esperienze.html#colazione" }
                      - { label: "Esperienze, escursioni", value: "esperienze.html#escursioni" }
                      - { label: "Il racconto", value: "racconto.html" }
          - name: tramonti
            label: "I nostri tramonti"
            widget: object
            fields:
              - { name: domanda, label: "Domanda sul cielo", widget: string }
              - { name: risposta, label: "Scritta sulle due foto", widget: string }
              - name: panorama
                label: "Foto a tutto schermo"
                widget: object
                fields:
                  - { name: foto, label: "Foto", widget: image }
                  - { name: alt, label: "Descrizione accessibile", widget: string }
                  - { name: width, widget: hidden, default: 1672 }
                  - { name: height, widget: hidden, default: 941 }
              - name: dettagli
                label: "Le due foto sotto"
                widget: list
                min: 2
                max: 2
                fields:
                  - { name: foto, label: "Foto", widget: image }
                  - { name: alt, label: "Descrizione accessibile", widget: string }
                  - { name: width, widget: hidden, default: 1448 }
                  - { name: height, widget: hidden, default: 1086 }
          - name: notte
            label: "Frase della notte"
            widget: object
            fields:
              - { name: riga1, label: "Prima riga", widget: string }
              - { name: riga2, label: "Seconda riga, in corsivo", widget: string }
          - name: ritorno
            label: "Foto del ritorno (la sera)"
            widget: object
            fields:
              - { name: foto, label: "Foto a tutto schermo", widget: image }
              - { name: alt, label: "Descrizione della foto", widget: string }
              - { name: kicker, label: "Riga piccola", widget: string, required: false }
              - { name: parola, label: "Parola sulla foto", widget: string }
          - name: contatti
            label: "Chiusura e modulo"
            widget: object
            fields:
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - { name: nota, label: "Frase sotto il titolo", widget: string, required: false }

      - name: racconto
        label: "Il racconto"
        file: content/racconto.json
        fields:
          - { name: titolo_pagina, label: "Titolo della pagina", widget: string }
          - { name: descrizione, label: "Descrizione per Google e social", widget: text }
          - name: hero
            label: "Apertura"
            widget: object
            fields:
              - { name: foto, label: "Foto a tutto schermo", widget: image }
              - { name: alt, label: "Descrizione della foto", widget: string }
              - { name: titolo, label: "Titolo", widget: string }
              - { name: sottotitolo, label: "Sottotitolo", widget: string }
          - name: sezioni
            label: "Capitoli"
            label_singular: "Capitolo"
            widget: list
            fields:
              - { name: id, label: "Nome tecnico (senza spazi)", widget: string, pattern: ["^[a-z0-9-]+$", "Solo lettere minuscole, numeri e trattini"] }
              - { name: frase_prima, label: "Frase a schermo intero prima del capitolo, prima riga", widget: string, required: false, hint: "Lasciate vuoto se non volete la frase." }
              - { name: frase_prima_corsivo, label: "Frase a schermo intero, seconda riga in corsivo", widget: string, required: false }
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - { name: testo, label: "Testo", widget: text, hint: "Una riga vuota separa i paragrafi." }
              - { name: citazione, label: "Citazione", widget: text, required: false }
              - { name: citazione_prima, label: "Citazione prima del testo", widget: boolean, default: false, required: false }
              - { name: foto, label: "Foto", widget: image, required: false }
              - { name: alt, label: "Descrizione della foto", widget: string, required: false }
              - { name: didascalia, label: "Didascalia", widget: string, required: false }
              - { name: galleria, label: "Due foto affiancate", widget: image, multiple: true, required: false, max: 2 }
              - { name: link, label: "Testo del link in fondo", widget: string, required: false }
              - name: link_url
                label: "Destinazione del link"
                widget: select
                required: false
                options:
                  - { label: "Le dimore", value: "camere.html" }
                  - { label: "Esperienze", value: "esperienze.html" }
                  - { label: "Home", value: "index.html" }
          - name: contatti
            label: "Chiusura"
            widget: object
            fields:
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }

      - name: dimore
        label: "Le dimore"
        file: content/dimore.json
        fields:
          - { name: titolo_pagina, label: "Titolo della pagina", widget: string }
          - { name: descrizione, label: "Descrizione per Google e social", widget: text }
          - name: hero
            label: "Apertura"
            widget: object
            fields:
              - { name: foto, label: "Foto a tutto schermo", widget: image }
              - { name: alt, label: "Descrizione della foto", widget: string }
              - { name: titolo, label: "Titolo", widget: string }
              - { name: sottotitolo, label: "Sottotitolo", widget: string }
          - name: intro
            label: "Introduzione"
            widget: object
            fields:
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - { name: testo, label: "Testo", widget: text }
          - name: stazione
            label: "Frase a schermo intero"
            widget: object
            fields:
              - { name: riga1, label: "Prima riga", widget: string, required: false }
              - { name: riga2, label: "Seconda riga, in corsivo", widget: string, required: false }
          - name: elenco
            label: "Le dimore"
            label_singular: "Dimora"
            widget: list
            fields:
              - { name: id, label: "Nome tecnico (senza spazi)", widget: string, pattern: ["^[a-z0-9-]+$", "Solo lettere minuscole, numeri e trattini"] }
              - { name: nome, label: "Nome", widget: string, hint: "Compare nel menu della pagina e nel modulo di richiesta. I piani della Cummersa vanno nella stessa dimora." }
              - { name: etichetta, label: "Riga piccola sopra il titolo", widget: string, required: false }
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - { name: testo, label: "Descrizione", widget: text, hint: "Una riga vuota separa i paragrafi." }
              - { name: caratteristiche, label: "Etichette (mq, ospiti, dotazioni)", widget: list, required: false, field: { name: voce, label: "Etichetta", widget: string } }
              - { name: foto, label: "Foto principale", widget: image, required: false }
              - { name: alt, label: "Descrizione della foto principale", widget: string, required: false }
              - { name: galleria, label: "Galleria", widget: image, multiple: true, required: false, hint: "Le prime tre sono le anteprime. Trascinate per riordinare." }
              - name: configurazioni
                label: "Possibilità di soggiorno"
                widget: list
                required: false
                hint: "Per la Cummersa: piano terra oppure entrambi i piani. Queste scelte compaiono anche nel modulo."
                fields:
                  - { name: nome, label: "Nome della scelta", widget: string }
                  - { name: testo, label: "Descrizione e supplemento", widget: text }
              - { name: esclusiva, label: "Nota sull’uso esclusivo", widget: text, required: false }
              - name: piani
                label: "Piani della stessa dimora"
                widget: list
                required: false
                hint: "Fiori di Campo al piano terra, Luce di Luna al primo piano. Non sono dimore prenotabili separatamente."
                fields:
                  - { name: id, label: "Nome tecnico (conservare i link esistenti)", widget: string, pattern: ["^[a-z0-9-]+$", "Solo lettere minuscole, numeri e trattini"] }
                  - { name: nome, label: "Nome del piano", widget: string }
                  - { name: etichetta, label: "Indicazione del piano", widget: string }
                  - { name: titolo, label: "Titolo", widget: string }
                  - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
                  - { name: testo, label: "Descrizione", widget: text }
                  - { name: caratteristiche, label: "Dotazioni del piano", widget: list, field: { name: voce, label: "Etichetta", widget: string } }
                  - { name: foto, label: "Foto principale", widget: image }
                  - { name: alt, label: "Descrizione della foto", widget: string }
                  - { name: galleria, label: "Galleria del piano", widget: image, multiple: true }
          - { name: nota_richiesta, label: "Nota sulla Cummersa nel modulo di richiesta", widget: text }
          - name: servizi
            label: "Servizi e attenzioni di casa"
            widget: object
            fields:
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - name: elenco
                label: "Schede"
                widget: list
                max: 8
                fields:
                  - { name: titolo, label: "Titolo", widget: string }
                  - { name: testo, label: "Testo", widget: string }

      - name: esperienze
        label: "Esperienze"
        file: content/esperienze.json
        fields:
          - { name: titolo_pagina, label: "Titolo della pagina", widget: string }
          - { name: descrizione, label: "Descrizione per Google e social", widget: text }
          - name: hero
            label: "Apertura"
            widget: object
            fields:
              - { name: foto, label: "Foto a tutto schermo", widget: image }
              - { name: alt, label: "Descrizione della foto", widget: string }
              - { name: titolo, label: "Titolo", widget: string }
              - { name: sottotitolo, label: "Sottotitolo", widget: string }
          - name: sezioni
            label: "Sezioni"
            label_singular: "Sezione"
            widget: list
            fields:
              - { name: id, label: "Nome tecnico (senza spazi)", widget: string, pattern: ["^[a-z0-9-]+$", "Solo lettere minuscole, numeri e trattini"] }
              - { name: frase_prima, label: "Frase a schermo intero prima della sezione, prima riga", widget: string, required: false }
              - { name: frase_prima_corsivo, label: "Frase a schermo intero, seconda riga in corsivo", widget: string, required: false }
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
              - { name: intro, label: "Frase introduttiva", widget: text, required: false }
              - { name: compatto, label: "Esperienze affiancate", widget: boolean, default: false, required: false }
              - name: attenzioni
                label: "Le attenzioni dei padroni di casa"
                widget: list
                required: false
                fields:
                  - { name: titolo, label: "Titolo", widget: string }
                  - { name: testo, label: "Testo", widget: text }
              - name: voci
                label: "Esperienze"
                label_singular: "Esperienza"
                widget: list
                fields:
                  - { name: ancora, label: "Collegamento diretto (facoltativo)", widget: string, required: false, pattern: ["^[a-z0-9-]+$", "Solo lettere minuscole, numeri e trattini"] }
                  - { name: etichetta, label: "Riga piccola sopra il titolo", widget: string, required: false }
                  - { name: titolo, label: "Titolo", widget: string }
                  - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
                  - { name: testo, label: "Testo", widget: text }
                  - { name: caratteristiche, label: "Etichette", widget: list, required: false, field: { name: voce, label: "Etichetta", widget: string } }
                  - { name: foto, label: "Foto", widget: image, required: false }
                  - { name: alt, label: "Descrizione della foto o del video", widget: string, required: false }
                  - { name: video, label: "Video loop MP4", widget: file, required: false, hint: "Usare una clip già ottimizzata, breve e senza audio." }
                  - { name: poster, label: "Immagine di anteprima del video", widget: image, required: false }
                  - { name: placeholder, label: "Foto in arrivo", widget: boolean, default: false, required: false }
                  - name: recensioni_cucina
                    label: "Recensioni sull’esperienza"
                    widget: object
                    required: false
                    fields:
                      - { name: titolo, label: "Titolo", widget: string }
                      - { name: nota, label: "Nota sugli estratti o sulle traduzioni", widget: string }
                      - { name: fonte, label: "Piattaforma", widget: string }
                      - { name: url, label: "Link alla fonte verificata", widget: string, pattern: ["^https://", "Usare un link HTTPS"] }
                      - name: voci
                        label: "Estratti"
                        widget: list
                        min: 2
                        max: 3
                        fields:
                          - { name: testo, label: "Breve estratto verificato", widget: text }
                          - { name: autore, label: "Autore come riportato nella fonte", widget: string }

              - name: galleria
                label: "Foto sotto l’esperienza"
                widget: list
                required: false
                max: 3
                fields:
                  - { name: foto, label: "Foto", widget: image }
                  - { name: alt, label: "Descrizione della foto", widget: string }
              - name: conclusione
                label: "Le attenzioni dei padroni di casa"
                widget: object
                required: false
                fields:
                  - { name: titolo, label: "Titolo", widget: string }
                  - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
                  - name: voci
                    label: "Testi di approfondimento"
                    widget: list
                    fields:
                      - { name: titolo, label: "Titolo", widget: string }
                      - { name: testo, label: "Testo", widget: text, hint: "Una riga vuota separa i paragrafi." }
          - name: contatti
            label: "Chiusura"
            widget: object
            fields:
              - { name: titolo, label: "Titolo", widget: string }
              - { name: titolo_corsivo, label: "Titolo, parte in corsivo", widget: string }
