        <form class="contact-form reveal" id="richiesta" novalidate>
          <div class="cf-fields">
            <div class="cf-grid">
              <label>{{ui.fullName}}*<input type="text" name="nome" required autocomplete="name" placeholder="{{ui.yourName}}"></label>
              <label>{{ui.email}}*<input type="email" name="email" required autocomplete="email" inputmode="email" placeholder="{{ui.exampleEmail}}"></label>
              <label>{{ui.phone}}<input type="tel" name="telefono" autocomplete="tel" inputmode="tel" placeholder="+39 …"></label>
              <label>{{ui.preferredStay}}<select name="dimora" aria-describedby="dimora-nota">
                <option value="">{{ui.suggestStay}}</option>
                {{#each dimore.scelte_richiesta}}<option>{{.}}</option>{{/each}}
              </select></label>
              <p class="cf-full dimora-nota" id="dimora-nota">{{dimore.nota_richiesta}}</p>
              <label>{{ui.arrival}}<input type="date" name="arrivo"></label>
              <label>{{ui.departure}}<input type="date" name="partenza"></label>
              <div class="cf-pair">
                <label>{{ui.adults}}<select name="adulti"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
                <label>{{ui.children}}<select name="bambini"><option selected>0</option><option>1</option><option>2</option><option>3</option></select></label>
              </div>
              <label>{{ui.interest}}<select name="interesse">
                <option value="">{{ui.stayOnly}}</option>
                {{#each site.form.interessi}}<option>{{.}}</option>{{/each}}
              </select></label>
              <label class="cf-full">{{ui.message}}<textarea name="messaggio" placeholder="{{ui.messageHint}}"></textarea></label>
              <label class="cf-check cf-full"><input type="checkbox" name="privacy" required> {{ui.privacy}}</label>
            </div>
            <div class="cf-actions">
              <button class="btn magnetic" type="submit"><span>{{site.form.bottone}}</span></button>
              <p class="cf-note">{{site.form.nota}}</p>
            </div>
          </div>
          <p class="cf-ok" hidden>{{site.form.grazie}}<br>{{site.form.grazie_riga2}}</p>
        </form>
        <p class="cta-alt reveal">{{ui.preferWrite}} <a href="https://wa.me/{{site.contatti.whatsapp}}">WhatsApp {{site.contatti.telefono}}</a> · <a href="mailto:{{site.contatti.email}}">{{site.contatti.email}}</a></p>
